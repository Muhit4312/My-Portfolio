<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Sky Blue Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />  <!-- Bright Sky Blue -->
      <stop offset="50%" stop-color="#0EA5E9" /> <!-- Vibrant Blue -->
      <stop offset="100%" stop-color="#0284C7" /> <!-- Deep Blue -->
    </linearGradient>
    
    <!-- Subtle Drop Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0369A1" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Sky Blue Background Circle/Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#skyGrad)" />
  
  <!-- "M" Letter Icon -->
  <g filter="url(#glow)">
    <text 
      x="50%" 
      y="54%" 
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
      font-weight="900" 
      font-size="320" 
      fill="#FFFFFF" 
      text-anchor="middle" 
      dominant-baseline="middle">
      M
    </text>
  </g>
</svg>
